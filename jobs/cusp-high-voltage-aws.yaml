                  {
                    "containerPort": 8265,
                    "name": "dashboard"
                  },
                  {
                    "containerPort": 10001,
                    "name": "client"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "32",
                    "memory": "200Gi",
                    "nvidia.com/gpu": "4"
                  },
                  "limits": {
                    "cpu": "32",
                    "memory": "200Gi",
                    "nvidia.com/gpu": "4"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "shm",
                    "mountPath": "/dev/shm"
                  },
                  {
                    "name": "public",
                    "mountPath": "/public",
                    "subPath": "devcontainer-shared"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "shm",
                "emptyDir": {
                  "medium": "Memory",
                  "sizeLimit": "16Gi"
                }
              },
              {
                "name": "public",
                "persistentVolumeClaim": {
                  "claimName": "fsx-lustre"
                }
              }
            ]
          }
        }
      }
    }
  }
