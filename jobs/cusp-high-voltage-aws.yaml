{
  "apiVersion": "ray.io/v1",
  "kind": "RayJob",
  "metadata": {
    "name": "jonathan-cusp-poisson-5kev",
    "namespace": "default",
    "annotations": {
      "slime.ai/owner": "jonathan.kelley"
    }
  },
  "spec": {
    "entrypoint": "bash -c 'set -euo pipefail; export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1; export CUSP_SOURCE_REVISION=070652d03b9b4081bc4c1b43eb6cf23901527504; python3 /public/jonathan/cusp/sources/070652d03b9b4081bc4c1b43eb6cf23901527504-high-voltage/src/run_space_charge_pilot.py --profile high-voltage --track 64 --trajectory-frames 1025 --case-timeout 1800 --out /public/jonathan/cusp/runs/poisson-5kev-070652d/attempt-$(date +%Y%m%d-%H%M%S-%N)' -- --actor-num-nodes 1 --actor-num-gpus-per-node 4 --rollout-num-gpus 0",
