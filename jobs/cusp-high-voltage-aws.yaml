        "imagePullSecrets": [
          {
            "name": "gcr-creds"
          }
        ],
        "containers": [
          {
            "name": "ray-job-submitter",
            "image": "us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df",
            "imagePullPolicy": "IfNotPresent",
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "200Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            }
          }
        ]
      }
    },
    "rayClusterSpec": {
      "headGroupSpec": {
        "rayStartParams": {},
        "template": {
          "spec": {
            "serviceAccountName": "slime-training-sa",
            "nodeSelector": {
              "kubernetes.io/arch": "amd64",
              "workload_type": "training"
            },
            "tolerations": [
              {
                "key": "nvidia.com/gpu",
                "operator": "Exists",
                "effect": "NoSchedule"
              }
            ],
            "imagePullSecrets": [
              {
                "name": "gcr-creds"
              }
            ],
            "containers": [
              {
                "name": "ray-head",
                "image": "us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df",
