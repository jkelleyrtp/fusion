# Submit through the broker only, one node, --priority 1.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: jonathan-cusp-gun-size
  namespace: default
  annotations:
    slime.ai/owner: jonathan.kelley
spec:
  entrypoint: >-
    bash -c 'set -euo pipefail;
    nvidia-smi -L;
    export CUSP_BUILD_DIR=/public/jonathan/cusp/build_cache TORCH_CUDA_ARCH_LIST=10.0;
    OUT=/public/jonathan/cusp/runs/gun-size-$(date +%Y%m%d-%H%M%S);
    common=(
    --inject-mode gun --gun-direction 0 -0.5 0.8660254037844386
    --particles 200000 --block-steps 2000
    --grid-r 1024 --grid-z 2048 --steps-per-gyro-inv 0.0125
    --tracked 128 --traj-samples 3000
    );
    CUDA_VISIBLE_DEVICES=0,1,2,3 python3 /public/jonathan/cusp/src/cusp_sim.py "${common[@]}"
    --out "$OUT/radius-25cm" --ring-radius 0.25 --ring-half-sep 0.125 --current 25000
    --inject-offset 0.15 --axial-margin 0.2 --inject-sigma 0.00025
    --space-charge-radius 0.075 --sim-time 1e-4 --traj-dt 2.5e-9
    --members 5,0.002,0,0.5,0 5,0.002,0,0.5,-3.229756875e-11
    30,0.002,0,0.5,0 30,0.002,0,0.5,-1.937854125e-10 & p0=$!;
    CUDA_VISIBLE_DEVICES=4,5,6,7 python3 /public/jonathan/cusp/src/cusp_sim.py "${common[@]}"
    --out "$OUT/radius-50cm" --ring-radius 0.5 --ring-half-sep 0.25 --current 50000
    --inject-offset 0.3 --axial-margin 0.4 --inject-sigma 0.0005
    --space-charge-radius 0.15 --sim-time 2e-4 --traj-dt 5e-9
    --members 5,0.004,0,0.5,0 5,0.004,0,0.5,-6.45951375e-11
    30,0.004,0,0.5,0 30,0.004,0,0.5,-3.87570825e-10 & p1=$!;
    wait "$p0"; wait "$p1";
    touch "$OUT/DONE";
    echo CUSP_GUN_SIZE_DONE "$OUT"' --
    --actor-num-nodes 1
    --actor-num-gpus-per-node 8
    --rollout-num-gpus 0
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submissionMode: K8sJobMode
  submitterConfig:
    backoffLimit: 2
  submitterPodTemplate:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: gcr-creds
      containers:
        - name: ray-job-submitter
          image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 500m, memory: 200Mi }
            limits: { cpu: "1", memory: 1Gi }
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          serviceAccountName: slime-training-sa
          nodeSelector:
            kubernetes.io/arch: amd64
            workload_type: training
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          imagePullSecrets:
            - name: gcr-creds
          containers:
            - name: ray-head
              image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
              imagePullPolicy: IfNotPresent
              env:
                - name: PYTHONFAULTHANDLER
                  value: "1"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
                limits: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
                - { name: public, mountPath: /public, subPath: devcontainer-shared }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 16Gi }
            - name: public
              persistentVolumeClaim: { claimName: fsx-lustre }
