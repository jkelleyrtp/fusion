# Potential-well sweep: electrons born isotropically in a 3 cm ball at the null, inside a 5 cm sphere of
# positive charge (attractive well, centre potential 270 V per 1e-9 C) vs 0 and negative. 8 members.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: jonathan-cusp-well
  namespace: default
  annotations:
    slime.ai/owner: jonathan.kelley
spec:
  entrypoint: >-
    bash -c 'set -euo pipefail;
    nvidia-smi -L;
    export CUSP_BUILD_DIR=/tmp/cusp_build TORCH_CUDA_ARCH_LIST=10.0;
    OUT=/public/jonathan/cusp/runs/$(date +%Y%m%d-%H%M%S);
    python3 /public/jonathan/cusp/cusp_sim.py --out $OUT
    --members 100,0.03,0,180,0 100,0.03,0,180,1e-9 100,0.03,0,180,3e-9 100,0.03,0,180,-1e-9 1000,0.03,0,180,0 1000,0.03,0,180,3e-9 1000,0.03,0,180,1e-8 30,0.03,0,180,1e-9
    --ring-radius 0.10 --ring-half-sep 0.05 --current 23000 --space-charge-radius 0.05 --inject-mode inside --inject-offset 0.03 --inject-sigma 1e-3
    --wall-fraction 0.98 --axial-margin 0.06 --integrator boris --adaptive 1 --steps-per-gyro-inv 0.025
    --particles 200000 --sim-time 100e-6 --block-steps 20000 --traj-samples 6000 --traj-dt 1e-8 --hist-every 400 "$@"
    && python3 /public/jonathan/cusp/cusp_viz.py --out $OUT
    && du -sh $OUT && echo CUSP_DEMO_DONE $OUT' --
    --actor-num-nodes 1
    --actor-num-gpus-per-node 8
    --rollout-num-gpus 0
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submissionMode: K8sJobMode
  submitterConfig:
    backoffLimit: 2
  submitterPodTemplate:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: gcr-creds
      containers:
        - name: ray-job-submitter
          image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 500m, memory: 200Mi }
            limits: { cpu: "1", memory: 1Gi }
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          serviceAccountName: slime-training-sa
          nodeSelector:
            kubernetes.io/arch: amd64
            workload_type: training
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          imagePullSecrets:
            - name: gcr-creds
          containers:
            - name: ray-head
              image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
              imagePullPolicy: IfNotPresent
              env:
                - name: PYTHONFAULTHANDLER
                  value: "1"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
                limits: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
                - { name: public, mountPath: /public, subPath: devcontainer-shared }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 16Gi }
            - name: public
              persistentVolumeClaim: { claimName: fsx-lustre }
