# Beam-stall sweep: 2015 geometry, 5 cm central sphere charged so the centre potential ~ 0.8-0.97 x beam
# energy (beam stalls at the null where B->0 scrambles pitch), inject_r 0.5-3 mm, plus 0 and +Q controls.
# 16 members, 2 rounds of 8 B200. Single node, priority 1.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: jonathan-cusp-beam
  namespace: default
  annotations:
    slime.ai/owner: jonathan.kelley
spec:
  entrypoint: >-
    bash -c 'set -euo pipefail;
    nvidia-smi -L;
    export CUSP_BUILD_DIR=/public/jonathan/cusp/build_cache TORCH_CUDA_ARCH_LIST=10.0;
    OUT=/public/jonathan/cusp/runs/$(date +%Y%m%d-%H%M%S);
    python3 /public/jonathan/cusp/src/cusp_sim.py --out $OUT
    --members 1000,0.0005,0,5,0 1000,0.0005,0,5,-3e-9 1000,0.0005,0,5,-3.6e-9 1000,0.0005,0,5,3.6e-9 1000,0.001,0,5,0 1000,0.001,0,5,-3e-9 1000,0.001,0,5,-3.6e-9 1000,0.001,0,5,3.6e-9 1000,0.003,0,5,0 1000,0.003,0,5,-3.6e-9 300,0.001,0,5,0 300,0.001,0,5,-1.05e-9 300,0.001,0,5,1e-9 100,0.001,0,5,0 100,0.001,0,5,-3.5e-10 100,0.001,0,5,3.5e-10
    --ring-radius 0.10 --ring-half-sep 0.05 --current 23000 --space-charge-radius 0.05 --inject-offset 0.03 --inject-sigma 2e-4
    --wall-fraction 0.98 --axial-margin 0.06 --integrator boris --adaptive 1 --steps-per-gyro-inv 0.025
    --particles 100000 --sim-time 20e-6 --block-steps 20000 --traj-samples 6000 --traj-dt 2e-11 --hist-every 400 "$@"
    && python3 /public/jonathan/cusp/src/cusp_viz.py --out $OUT
    && du -sh $OUT && echo CUSP_DEMO_DONE $OUT' --
    --actor-num-nodes 1
    --actor-num-gpus-per-node 8
    --rollout-num-gpus 0
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submissionMode: K8sJobMode
  submitterConfig:
    backoffLimit: 2
  submitterPodTemplate:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: gcr-creds
      containers:
        - name: ray-job-submitter
          image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 500m, memory: 200Mi }
            limits: { cpu: "1", memory: 1Gi }
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          serviceAccountName: slime-training-sa
          nodeSelector:
            kubernetes.io/arch: amd64
            workload_type: training
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          imagePullSecrets:
            - name: gcr-creds
          containers:
            - name: ray-head
              image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
              imagePullPolicy: IfNotPresent
              env:
                - name: PYTHONFAULTHANDLER
                  value: "1"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
                limits: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
                - { name: public, mountPath: /public, subPath: devcontainer-shared }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 16Gi }
            - name: public
              persistentVolumeClaim: { claimName: fsx-lustre }
