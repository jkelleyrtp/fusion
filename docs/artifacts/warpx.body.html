<div id="root"></div>
<script type="text/jsx">
const loops = {
  ours: {
    nodes: [
      { id: "p", title: "Particles", sub: "positions and velocities" },
      { id: "d", title: "Deposit charge", sub: "charge on the mesh" },
      { id: "s", title: "Poisson solve", sub: "electric field only" },
      { id: "b", title: "Coil field", sub: "fixed table, never updated", selected: true },
      { id: "g", title: "Gather E and B", sub: "at each particle" },
      { id: "m", title: "Push", sub: "Newtonian Boris" },
    ],
    edges: [
      { from: "p", to: "d" }, { from: "d", to: "s" }, { from: "s", to: "g" },
      { from: "b", to: "g", label: "vacuum B" }, { from: "g", to: "m" },
    ],
    note: "Our code: the plasma never changes the magnetic field, so it cannot show a plasma pushing the field out and plugging the cusps.",
  },
  warpx: {
    nodes: [
      { id: "p", title: "Particles", sub: "positions and momenta" },
      { id: "d", title: "Deposit charge and current", sub: "current on the mesh", selected: true },
      { id: "s", title: "Maxwell or Darwin solve", sub: "E and B both evolve", selected: true },
      { id: "b", title: "Coil field", sub: "added as an external field" },
      { id: "g", title: "Gather E and B", sub: "coil field + plasma field" },
      { id: "m", title: "Push", sub: "relativistic Boris, Vay or Higuera-Cary" },
      { id: "c", title: "Collisions and fusion", sub: "optional Monte Carlo step" },
    ],
    edges: [
      { from: "p", to: "d" }, { from: "d", to: "s", label: "plasma current" }, { from: "s", to: "g" },
      { from: "b", to: "g", label: "vacuum B" }, { from: "g", to: "m" }, { from: "m", to: "c" },
    ],
    note: "WarpX: the plasma's own current feeds the field solve every step, so the magnetic field responds to plasma pressure. That is the missing physics.",
  },
};

const capabilities = [
  { need: "Plasma changes the magnetic field", ours: "No", warpx: "Yes", how: "Full Maxwell (algo.maxwell_solver = yee), or a Darwin solver that keeps slow magnetic effects and drops light waves (algo.evolve_scheme = semi_implicit_darwin)", gap: true },
  { need: "One simulation across many GPUs", ours: "No", warpx: "Yes", how: "One MPI rank per GPU; built with WarpX_COMPUTE=CUDA", gap: true },
  { need: "Coarser mesh than the Debye length", ours: "No", warpx: "Yes", how: "Implicit, energy-conserving solvers (theta_implicit_em, semi_implicit_em)", gap: true },
  { need: "Relativistic electrons (50 keV and up)", ours: "No, design pending", warpx: "Yes", how: "algo.particle_pusher = boris, vay or higuera", gap: true },
  { need: "Coulomb collisions", ours: "No", warpx: "Yes", how: "collision type pairwisecoulomb", gap: true },
  { need: "Fusion reactions", ours: "No", warpx: "Yes", how: "collision type nuclearfusion: D-D, D-T, D-He3, p-B11", gap: true },
  { need: "Kinetic ions with fluid electrons", ours: "No", warpx: "Yes", how: "algo.maxwell_solver = hybrid (Ohm's law)", gap: true },
  { need: "Coil magnetic field", ours: "Yes", warpx: "Yes", how: "External field from a formula or an openPMD file (particles.B_ext_particle_init_style, warpx.B_ext_grid_init_style)" },
  { need: "Coil casings and gun barrels", ours: "Yes", warpx: "Yes", how: "Embedded boundary from a formula or STL file, with a set potential (warpx.eb_implicit_function, warpx.eb_potential)" },
  { need: "Electron guns", ours: "Yes, but adds energy above a few amps", warpx: "Yes", how: "Flux injection from a plane or from the embedded boundary (injection_style = NFluxPerCell)" },
  { need: "Background gas ionization", ours: "Yes", warpx: "Yes", how: "collision type background_mcc" },
  { need: "Geometries", ours: "3D box", warpx: "1D, 2D, 3D, cylindrical, spherical", how: "geometry.dims = 1, 2, 3, RZ, RCYLINDER, RSPHERE. Embedded boundaries are 2D/3D Cartesian only" },
  { need: "Output", ours: "JSON history, snapshots", warpx: "openPMD, plotfiles", how: "Reduced diagnostics (energies), and a record of every particle absorbed at a boundary" },
];

// Cost model: particle-steps = cells x particles per cell x steps. All sizes are my estimates.
const stages = [
  { stage: "0", name: "Build and smoke test", what: "Compile for our B200 nodes, run a shipped example on 1 and 8 GPUs, measure throughput", cells: 0, ppc: 0, steps: 0, runs: 1, proves: "It runs on our cluster and we know its real speed" },
  { stage: "1", name: "Reproduce the published 2D result", what: "2D picket-fence cusp at high plasma pressure (Park et al. 2019)", cells: 4e6, ppc: 200, steps: 2e5, runs: 3, proves: "We get the same thin current layer, so our setup is trustworthy" },
  { stage: "2", name: "2D scans", what: "Leak width against plasma pressure, ion-to-electron mass ratio and device size", cells: 4e6, ppc: 200, steps: 2e5, runs: 60, proves: "How the leak hole scales, in 2D" },
  { stage: "3a", name: "Small 3D six-coil device", what: "Device radius of 50 electron orbit-widths", cells: 8e6, ppc: 128, steps: 1e5, runs: 20, proves: "3D corner and edge cusps behave like the 2D picture, or not" },
  { stage: "3b", name: "Large 3D six-coil device", what: "Device radius of 200 electron orbit-widths", cells: 5e8, ppc: 100, steps: 5e5, runs: 5, proves: "The scaling law, measured over a 4x range of size" },
];

const risks = [
  { risk: "Speed on our GPUs is unknown", detail: "The cost table assumes a throughput we have not measured. Stage 0 measures it." },
  { risk: "Explicit runs must resolve the Debye length", detail: "The implicit solvers avoid this, but I have not checked how well they work with embedded boundaries or on GPUs. Fallback: pick hot, strongly magnetized parameters where the Debye length is close to the electron orbit width." },
  { risk: "Scaled, not real, parameters", detail: "A real reactor is ~6500 electron orbit-widths across; we can simulate 50 to 200 with a reduced ion mass. The answer is a scaling law to extrapolate, not a direct reactor simulation." },
  { risk: "Multi-GPU inside our job system", detail: "WarpX wants MPI with one rank per GPU. That is routine on one 8-GPU node; beyond one node conflicts with the current one-node rule in AGENTS.md." },
  { risk: "Learning curve and validation", detail: "A new code can be misconfigured as easily as ours was. That is why stage 1 is a reproduction of a published result before anything new." },
];

const sample = `# Illustrative only: parameter names are from the WarpX docs, values are placeholders and untested.
geometry.dims = 3
algo.maxwell_solver = yee                 # full electromagnetic field solve
algo.particle_pusher = boris              # relativistic

# six coils as an external field, given as formulas of x, y, z, t
particles.B_ext_particle_init_style = parse_B_ext_particle_function
particles.Bx_external_particle_function(x,y,z,t) = "..."

# coil casings as a grounded embedded boundary
warpx.eb_implicit_function = "..."        # positive inside the metal
warpx.eb_potential(x,y,z,t) = "0."

particles.species_names = electrons deuterium tritium
electrons.injection_style = NFluxPerCell  # an electron gun: a flux through a plane
electrons.surface_flux_pos = -0.65
electrons.flux_normal_axis = z
electrons.flux_direction = +1

collisions.collision_names = coulomb dt_fusion
coulomb.type = pairwisecoulomb
dt_fusion.type = nuclearfusion            # D-T reaction, products become new particles`;

function hours(s, rate) { return s.cells * s.ppc * s.steps / rate / 3600; }
function fmt(x) {
  if (x === 0) return "small";
  if (x >= 1000) return Math.round(x / 100) * 100 + "";
  if (x >= 10) return Math.round(x) + "";
  return x.toFixed(1);
}

function Report() {
  const [which, setWhich] = useState("warpx");
  const [rate, setRate] = useState("1e9");
  const r = Number(rate);
  const loop = loops[which];
  const total = stages.reduce((a, s) => a + hours(s, r) * s.runs, 0);
  return (
    <PageLayout title="WarpX: what it is and what it would do for us" subtitle="An open-source plasma simulator that includes the physics our code lacks, and what a cusp-plugging study on it would look like.">
      <BannerCard variant="info" title="In one paragraph">
        WarpX is an open-source particle-in-cell code, the same kind of simulator as ours, built by a US national-lab collaboration for the largest GPU supercomputers.
        It differs from ours in one way that matters: the plasma's own currents change the magnetic field. That is exactly what the cusp-plugging question needs.
        It also runs one simulation across many GPUs and has collisions and fusion reactions built in. I have read its documentation but not yet run it.
      </BannerCard>

      <StatsRow columns={4}>
        <StatCard label="License"><StatCardValue>BSD-3</StatCardValue><StatCardCaption>Free to use and modify</StatCardCaption></StatCard>
        <StatCard label="GPU model"><StatCardValue>1 rank per GPU</StatCardValue><StatCardCaption>CUDA build, MPI between GPUs</StatCardCaption></StatCard>
        <StatCard label="Track record"><StatCardValue>Gordon Bell 2022</StatCardValue><StatCardCaption>Top prize in supercomputing</StatCardCaption></StatCard>
        <StatCard label="Fusion reactions"><StatCardValue>4</StatCardValue><StatCardCaption>D-D, D-T, D-He3, p-B11</StatCardCaption></StatCard>
      </StatsRow>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">How each time step works</Text>
        <div className="flex items-center gap-3">
          <SegmentedControl value={which} onValueChange={setWhich} size="small">
            <SegmentedControlItem value="ours">Our code</SegmentedControlItem>
            <SegmentedControlItem value="warpx">WarpX</SegmentedControlItem>
          </SegmentedControl>
          <Text size={12} className="text-text-secondary">Highlighted boxes are where the two differ. The sequence repeats every step.</Text>
        </div>
        <div className="mx-auto w-full max-w-[520px]"><Diagram nodes={loop.nodes} edges={loop.edges} direction="TB" /></div>
        <Text size={13} className="text-text-secondary">{loop.note}</Text>
      </div>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">What it has that we need</Text>
        <Text size={13} className="text-text-secondary">The first seven rows are things our code cannot do. Setting names in the last column are from the WarpX documentation.</Text>
        <Table wrapText>
          <TableHeader>
            <TableRow><TableHead>Need</TableHead><TableHead>Our code</TableHead><TableHead>WarpX</TableHead><TableHead>How, in WarpX</TableHead></TableRow>
          </TableHeader>
          <TableBody>
            {capabilities.map((c) => (
              <TableRow key={c.need}>
                <TableCell>{c.need}</TableCell>
                <TableCell>{c.gap ? <Badge variant="destructive">{c.ours}</Badge> : c.ours}</TableCell>
                <TableCell>{c.gap ? <Badge variant="success">{c.warpx}</Badge> : c.warpx}</TableCell>
                <TableCell><span className="text-[12px] text-text-secondary">{c.how}</span></TableCell>
              </TableRow>
            ))}
          </TableBody>
        </Table>
      </div>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">What a cusp-plugging study would look like</Text>
        <Text size={13} className="text-text-secondary">
          The question: at high plasma pressure, how wide is the hole each cusp leaks through? A metre-scale, 5 to 10 tesla machine breaks even only if that hole is one to two electron orbit-widths across.
          The plan starts by reproducing a published result, then moves to what has not been done.
        </Text>
        <div className="flex items-center gap-3">
          <Text size={12} className="text-text-secondary">Assumed speed, particle-steps per GPU-second</Text>
          <SimpleSelect options={[{ value: "3e8", label: "300 million (cautious)" }, { value: "1e9", label: "1 billion (typical claim)" }]} value={rate} onValueChange={setRate} />
        </div>
        <Table wrapText>
          <TableHeader>
            <TableRow><TableHead>Stage</TableHead><TableHead>Run</TableHead><TableHead>Mesh cells</TableHead><TableHead>Particles</TableHead><TableHead>GPU-hours per run</TableHead><TableHead>Runs</TableHead><TableHead>What it proves</TableHead></TableRow>
          </TableHeader>
          <TableBody>
            {stages.map((s) => (
              <TableRow key={s.stage}>
                <TableCell>{s.stage}</TableCell>
                <TableCell><div>{s.name}</div><div className="text-[12px] text-text-secondary">{s.what}</div></TableCell>
                <TableCell>{s.cells ? s.cells.toExponential(0) : "n/a"}</TableCell>
                <TableCell>{s.cells ? (s.cells * s.ppc).toExponential(0) : "n/a"}</TableCell>
                <TableCell>{fmt(hours(s, r))}</TableCell>
                <TableCell>{s.runs}</TableCell>
                <TableCell><span className="text-[12px]">{s.proves}</span></TableCell>
              </TableRow>
            ))}
          </TableBody>
        </Table>
        <Text size={13} className="text-text-secondary">
          Whole programme at this speed: about {fmt(total)} GPU-hours. Stage 3b alone needs roughly {fmt(hours(stages[4], r) / 72)} GPUs for three days per run, which is more than one node.
          Mesh sizes, particle counts and step counts are my estimates, not measurements.
        </Text>
      </div>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">What an input looks like</Text>
        <Text size={13} className="text-text-secondary">A run is a text file of settings, or a Python script. This sketch shows the pieces we would use.</Text>
        <CodeBlock code={sample} />
      </div>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">Risks and unknowns</Text>
        <Table wrapText>
          <TableHeader><TableRow><TableHead>Risk</TableHead><TableHead>Detail</TableHead></TableRow></TableHeader>
          <TableBody>
            {risks.map((x) => (<TableRow key={x.risk}><TableCell>{x.risk}</TableCell><TableCell><span className="text-[13px]">{x.detail}</span></TableCell></TableRow>))}
          </TableBody>
        </Table>
      </div>

      <div className="flex flex-col gap-2">
        <Text size={15} weight="semibold">What stays in our own code</Text>
        <Text size={13}>
          Small, electron-rich devices such as POPS, where the plasma does not change the magnetic field and one GPU holds the whole problem. Our dashboard, job tooling and analysis scripts carry over to WarpX runs unchanged in purpose; only the simulator underneath changes.
        </Text>
      </div>

      <Footnote>
        Sources: WarpX README and parameter documentation (github.com/BLAST-WarpX/warpx, development branch, read 2026-10-15); Park et al., Front. Astron. Space Sci. 6, 74 (2019) for the 2D picket-fence result.
        Nothing here has been run on our cluster. Open decision: whether to lift the one-node limit for stage 3b.
      </Footnote>
    </PageLayout>
  );
}
render(<Report />);
</script>
