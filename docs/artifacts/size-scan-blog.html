eact.createElement(TableHead, null, \"Electric field crowding on the axis at the end (about 1 = none)\"            )\n            , React.createElement(TableHead, null, \"Holding time (electron crossings)\"   )\n          )\n        )\n        , React.createElement(TableBody, null\n          , mirrors.map((m) => (\n            React.createElement(TableRow, { key: m[0],}\n              , React.createElement(TableCell, null, m[0])\n              , React.createElement(TableCell, null, m[1])\n              , React.createElement(TableCell, null, m[2])\n            )\n          ))\n        )\n      )\n      , React.createElement(P, null, \"I had told myself the mirrors passed the same check that caught the wall fault. That check skipped the inner tenth of the radius, which is where this is. Every run now carries the measure above, so a spoiled run shows up in its own line of the table.\"\n\n\n\n      )\n      , React.createElement(P, null, \"So neither treatment of the ends is right yet. The repeat allows a current a real device cannot carry. The mirrors forbid it and break something on the axis.\"\n\n\n      )\n\n      , React.createElement(H, null, \"Where the answer stands\"   )\n      , React.createElement(Text, { size: 12, weight: \"medium\", className: \"block text-text-secondary\" ,}, \"Holding time (electron crossings) against device size\"      )\n      , React.createElement(ChartContainer, { config: scanSeries, style: { height: 320, width: \"100%\" },}\n        , React.createElement(LineChart, { data: sizes, margin: { left: 8, right: 16, bottom: 24 },}\n          , React.createElement(ChartGrid, null )\n          , React.createElement(ChartXAxis, { type: \"number\", dataKey: \"size\", domain: [0.25, 1], ticks: [0.25, 0.375, 0.5, 0.75, 1],\n                      tickFormatter: (v) => v + \"x\",\n                      label: { value: \"Device size (1x = Park 2019)\", position: \"bottom\", offset: 4 },} )\n          , React.createElement(ChartYAxis, { domain: [0, 1 ame at three fills.\",\n        \"Heavier ions help. Plasma leaves at the speed of its ions through a hole whose size barely depends on ion mass. An earlier result of mine, that the leak widens like an ion orbit, was the particle-count problem in disguise and is withdrawn. Our ions are 64 electron masses and real deuterium is 3,670, so this is a long reach.\",\n      ],} )\n\n      , React.createElement(H, null, \"What comes next\"  )\n      , React.createElement(List, { items: [\n        \"Find out whether the pile-up on the axis is a mesh artefact. A run on a finer mesh is queued.\",\n        \"If it is not, model what a device actually is: a finite row of coils with real end walls. Our two-coil runs have end walls and never showed the repeat problem.\",\n        \"Redo the size scan in whichever model survives, with enough particles at 1x and 2x.\",\n        \"Only then go back to 3D and to charged coils, which is where this started.\",\n      ],} )\n\n      , React.createElement(Footnote, null, \"Finished runs only, read from the reduced table of campaign pw1 on 17 October 2026, 23:05 UTC. Caveats: 2D only, so nothing that varies around the axis can appear; ions of 64 electron masses, electrons fed at 100 keV, no collisions in the main runs; our holding times are about half of what Park's paper reports for the same case and the reason is not found (the boundary thickness matches); WarpX is used with three patches that nobody but their author has reviewed. Tables with case names are in docs/cusp-results.md and the run-by-run log, mistakes included, is in docs/progress-2026-10-17.md.\"\n\n\n\n\n\n\n      )\n    )\n  );\n}\nrender(React.createElement(Report, null ));\n")</script>
