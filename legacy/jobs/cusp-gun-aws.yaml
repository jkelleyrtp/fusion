# Submit through the broker only, one node, --priority 1.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: jonathan-cusp-gun
  namespace: default
  annotations:
    slime.ai/owner: jonathan.kelley
spec:
  entrypoint: >-
    bash -c 'set -euo pipefail;
    nvidia-smi -L;
    export CUSP_BUILD_DIR=/public/jonathan/cusp/build_cache TORCH_CUDA_ARCH_LIST=10.0;
    OUT=/public/jonathan/cusp/runs/gun-$(date +%Y%m%d-%H%M%S);
    python3 /public/jonathan/cusp/src/cusp_sim.py --out "$OUT"
    --ring-radius 0.05 --ring-half-sep 0.025 --current 5000
    --inject-mode gun --inject-offset 0.03 --axial-margin 0.04
    --gun-direction 0 -0.007142857 1 --inject-sigma 0.00005
    --space-charge-radius 0.015 --particles 200000 --sim-time 2e-5
    --steps-per-gyro-inv 0.025 --block-steps 2000
    --tracked 64 --traj-samples 3000 --traj-dt 5e-10
    --members
    1.4,0.0004,0,0.5,0 1.4,0.0004,0,0.5,-1.80866385e-12
    1.4,0.002,0,0.5,0 1.4,0.002,0,0.5,-1.80840904e-12
    5,0.0004,0,0.5,0 5,0.0004,0,0.5,-6.45951375e-12
    5,0.002,0,0.5,0 5,0.002,0,0.5,-6.45860373e-12
    30,0.0004,0,0.5,0 30,0.0004,0,0.5,-3.87570825e-11
    30,0.002,0,0.5,0 30,0.002,0,0.5,-3.87516224e-11
    100,0.0004,0,0.5,0 100,0.0004,0,0.5,-1.29190275e-10
    100,0.002,0,0.5,0 100,0.002,0,0.5,-1.29172075e-10;
    touch "$OUT/DONE";
    echo CUSP_GUN_DONE "$OUT"' --
    --actor-num-nodes 1
    --actor-num-gpus-per-node 8
    --rollout-num-gpus 0
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  submissionMode: K8sJobMode
  submitterConfig:
    backoffLimit: 2
  submitterPodTemplate:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: gcr-creds
      containers:
        - name: ray-job-submitter
          image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 500m, memory: 200Mi }
            limits: { cpu: "1", memory: 1Gi }
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          serviceAccountName: slime-training-sa
          nodeSelector:
            kubernetes.io/arch: amd64
            workload_type: training
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          imagePullSecrets:
            - name: gcr-creds
          containers:
            - name: ray-head
              image: us-docker.pkg.dev/cognition-research/cognition-training/slime:08110256_ubuntu_2e3428df
              imagePullPolicy: IfNotPresent
              env:
                - name: PYTHONFAULTHANDLER
                  value: "1"
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
              resources:
                requests: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
                limits: { cpu: "32", memory: 200Gi, nvidia.com/gpu: "8" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
                - { name: public, mountPath: /public, subPath: devcontainer-shared }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 16Gi }
            - name: public
              persistentVolumeClaim: { claimName: fsx-lustre }
